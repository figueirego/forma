name: Validate Forma

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Forma
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependency
        run: npm ci --ignore-scripts
      - name: Validate source, tests, package and generated files
        run: npm run check
      - name: Install Chromium for rendered regression
        run: npx playwright install --with-deps chromium
      - name: Exercise preview interactions in Chromium
        run: npm run test:browser
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forma-browser-regression
          path: artifacts/browser-regression/
          retention-days: 14
          if-no-files-found: ignore
